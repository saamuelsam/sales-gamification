version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sales_postgres
    restart: always
    environment:
      POSTGRES_DB: sales_gamification
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sales_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_backend
    restart: always
    environment:
      # Database
      DATABASE_URL: postgres://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@sales_postgres:5432/${DB_NAME:-sales_gamification}
      
      # App
      NODE_ENV: production
      PORT: 4000
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      
      # Email - Hostinger
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: 465
      SMTP_SECURE: true
      SMTP_USER: fortalengenhariasolar@sesfortal.com.br
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: fortalengenhariasolar@sesfortal.com.br
      SMTP_FROM_NAME: Fortal Energia Solar
      
      # URLs
      FRONTEND_URL: https://sales.sesfortal.com.br
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - sales_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://sales.sesfortal.com.br/api
    container_name: sales_frontend
    restart: always
    networks:
      - sales_network

  nginx:
    image: nginx:alpine
    container_name: sales_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sales_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sales_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
