version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sales_postgres
    restart: always
    environment:
      POSTGRES_DB: sales_gamification
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sales_network

  backend:
    build: ./backend
    container_name: sales_backend
    restart: always
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres:5432/sales_gamification
      NODE_ENV: production
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    networks:
      - sales_network

  frontend:
    build: ./frontend
    container_name: sales_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sales_network

  nginx:
    image: nginx:alpine
    container_name: sales_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - sales_network

volumes:
  postgres_data:

networks:
  sales_network:
    driver: bridge
